[package]
name = "mayber"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/al8n/mayber"
homepage = "https://github.com/al8n/mayber"
documentation = "https://docs.rs/mayber"
description = "A zero-cost enum for handling either references or owned values with a unified interface"
license = "MIT OR Apache-2.0"
rust-version = "1.56"
categories = ["data-structures", "rust-patterns", "no-std", "no-std::no-alloc"]
keywords = ["reference", "maybe", "cow", "zero-cost", "deref"]

[features]
default = ["std"]
alloc = []
std = []

serde = ["dep:serde_core"]

[dependencies]
rustversion = "1"

serde_core = { version = "1", optional = true, default-features = false }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
