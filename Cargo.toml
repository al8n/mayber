[package]
name = "mayber"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/al8n/mayber"
homepage = "https://github.com/al8n/mayber"
documentation = "https://docs.rs/mayber"
description = "A zero-cost enum for handling either references or owned values with a unified interface"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
categories = ["data-structures", "rust-patterns", "no-std", "no-std::no-alloc"]
keywords = ["reference", "maybe", "cow", "zero-cost", "deref"]

[features]
default = ["std"]
alloc = ["serde-core_1?/alloc", "rkyv_0_8?/alloc", "zerocopy_0_8?/alloc"]
std = ["alloc", "serde-core_1?/std", "borsh_1?/std", "schemars_1?/std", "proptest_1?/std", "rkyv_0_8?/std", "zerocopy_0_8?/std"]

serde = ["serde_1"]
serde_1 = ["dep:serde-core_1"]

quickcheck = ["quickcheck_1"]
quickcheck_1 = ["dep:quickcheck_1", "std"]

proptest = ["proptest_1"]
proptest_1 = ["dep:proptest_1", "alloc"]

arbitrary = ["arbitrary_1"]
arbitrary_1 = ["dep:arbitrary_1", "std"]

schemars = ["schemars_1"]
schemars_1 = ["dep:schemars_1", "alloc"]

borsh = ["borsh_1"]
borsh_1 = ["dep:borsh_1", "alloc"]

rkyv = ["rkyv_0_8"]
rkyv_0_8 = ["dep:rkyv_0_8"]

zerocopy = ["zerocopy_0_8"]
zerocopy_0_8 = ["dep:zerocopy_0_8"]

[dependencies]
serde-core_1 = { package = "serde_core", version = "1.0.229", optional = true, default-features = false }

quickcheck_1 = { package = "quickcheck", version = "1.1.0", optional = true, default-features = false }
proptest_1 = { package = "proptest", version = "1.11.0", optional = true, default-features = false, features = ["alloc", "no_std"] }
arbitrary_1 = { package = "arbitrary", version = "1.5.0", optional = true, default-features = false }
schemars_1 = { package = "schemars", version = "1.2.3", optional = true, default-features = false }
borsh_1 = { package = "borsh", version = "1.8.1", optional = true, default-features = false }
rkyv_0_8 = { package = "rkyv", version = "0.8.18", optional = true, default-features = false, features = ["bytecheck"] }
zerocopy_0_8 = { package = "zerocopy", version = "0.8.63", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
# Exercise each tier without the test codec enabling Serde's alloc or std support.
postcard = { version = "1.1.3", default-features = false }

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
] }
